openapi: 3.1.0
info:
  title: Mangarr Manga-Gateway API
  version: "1.0.0"
  description: >
    Single external "manga-gateway" process exposing BOTH a search/indexer surface
    (the Jackett/Torznab analog) and a download surface (the SABnzbd/qBittorrent analog).
    One authenticated secure-site session + one anti-bot solver are shared across both
    surfaces. Mangarr registers this one host as one IIndexer and one IDownloadClient.

    Conceptual model: Torznab (caps -> gated search -> normalized release list).
    Wire format: JSON over HTTP(S). See spikes 001 (download), 002 (search), 003 (Mangarr migration).
servers:
  - url: "http://localhost:9191/api/v1"
    description: Default localhost bind (recommended). Prepend UrlBase if configured.

security:
  - ApiKeyHeader: []
  - ApiKeyQuery: []

paths:
  # ─────────────────────────── SEARCH SURFACE (spike 002) ───────────────────────────
  /caps:
    get:
      summary: Capabilities handshake — sources, supported params, limits, formats
      operationId: getCaps
      responses:
        "200":
          description: Capabilities document (clients should cache 6-12h)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /search:
    post:
      summary: Search across configured aggregator sources
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Releases (per-source failures reported in warnings[], NOT as HTTP error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /recent:
    get:
      summary: Recent-release feed (RSS-sync peer of IIndexer.FetchRecent)
      operationId: getRecent
      parameters:
        - { name: sources,   in: query, schema: { type: array, items: { type: string } }, description: "Source keys as repeated params (?sources=a&sources=b); a single CSV value is also accepted. Omit = all enabled" }
        - { name: languages, in: query, schema: { type: array, items: { type: string } }, description: "BCP-47 codes as repeated params; a single CSV value is also accepted" }
        - { name: limit,     in: query, schema: { type: integer, default: 100, maximum: 100 } }
        - { name: since,     in: query, schema: { type: string, format: date-time }, description: "Return items newer than this (optimization)" }
      responses:
        "200":
          description: Releases, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─────────────────────────── DOWNLOAD SURFACE (spike 001) ───────────────────────────
  /downloads:
    post:
      summary: Submit a grab (release handle) -> returns gateway job id
      operationId: submitDownload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitRequest" }
      responses:
        "200":
          description: Job accepted (idempotent on releaseHandle)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "400":
          description: Release no longer resolvable / rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      summary: List live + recently-finished jobs (maps to IDownloadClient.GetItems)
      operationId: getDownloads
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/DownloadJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /downloads/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      summary: Single job (used to refine OutputPath — GetImportItem)
      operationId: getDownload
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove job (and optionally its files) — maps to RemoveItem
      operationId: removeDownload
      parameters:
        - { name: deleteData, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /status:
    get:
      summary: Output root folders + capabilities (maps to IDownloadClient.GetStatus)
      operationId: getStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─────────────────────────── SHARED ───────────────────────────
  /version:
    get:
      summary: Version / health probe (Test() for both surfaces)
      operationId: getVersion
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [version, status]
                properties:
                  version: { type: string }
                  status:  { type: string, enum: [ok, degraded] }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    ApiKeyHeader: { type: apiKey, in: header, name: X-Api-Key }
    ApiKeyQuery:  { type: apiKey, in: query,  name: apikey }

  responses:
    Unauthorized:
      description: Missing/invalid API key
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Malformed request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer }, description: seconds }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:    { type: string, enum: [auth, rate_limited, source_unavailable, bad_request, not_found, internal] }
            message: { type: string }

    Capabilities:
      type: object
      required: [gatewayVersion, sources, supportedSearchParams, limits, downloadFormats]
      properties:
        gatewayVersion: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceCap" }
        supportedSearchParams:
          type: array
          items: { type: string }
          example: [q, mangadexId, anilistId, malId, chapter, volume, language, sourceKey]
        limits:
          type: object
          properties:
            defaultPageSize: { type: integer, example: 50 }
            maxPageSize:     { type: integer, example: 100 }
        downloadFormats:
          type: array
          items: { type: string, enum: [cbz, cbt, folder] }

    SourceCap:
      type: object
      required: [key, name, enabled, supportsSearch, supportsRecent]
      properties:
        key:                { type: string, example: "comix" }
        name:               { type: string, example: "Comix" }
        enabled:            { type: boolean }
        supportsSearch:     { type: boolean }
        supportsRecent:     { type: boolean }
        idTypes:            { type: array, items: { type: string }, example: [mangadexId] }
        languages:          { type: array, items: { type: string }, example: [en, es-la] }
        rateLimitPerMinute: { type: integer }
        antibot:            { type: string, enum: [none, cloudflare, "cloudflare+encrypted"] }

    SearchRequest:
      type: object
      required: [type]
      properties:
        type:        { type: string, enum: [manga, chapter] }
        query:       { type: string, description: "cleaned title; recommended even when ids present" }
        ids:
          type: object
          additionalProperties: true
          example: { mangadexId: "32d76d19-…", anilistId: 105398, malId: 121496 }
        chapter:     { type: number, description: "decimal chapter number; for type=chapter", example: 179.0 }
        volume:      { type: integer, nullable: true }
        languages:   { type: array, items: { type: string }, example: [en] }
        sources:     { type: array, items: { type: string }, description: "omit = all enabled" }
        interactive: { type: boolean, default: false }
        limit:       { type: integer, default: 50 }
        offset:      { type: integer, default: 0 }

    ReleaseListResponse:
      type: object
      required: [releases]
      properties:
        releases:
          type: array
          items: { $ref: "#/components/schemas/Release" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/SourceWarning" }

    SourceWarning:
      type: object
      required: [sourceKey, code, message]
      properties:
        sourceKey: { type: string }
        code:      { type: string, example: source_degraded }
        message:   { type: string }

    Release:
      type: object
      required: [guid, title, sourceKey, downloadHandle, publishDate]
      properties:
        guid:            { type: string, description: "dedup key; Mangarr de-dupes by this" }
        title:           { type: string, description: "MUST be parseable by Mangarr's MangaParser (name + chapter + group/lang)" }
        sourceKey:       { type: string }
        downloadHandle:  { type: string, description: "opaque; submitted back to POST /downloads. TTL >= 30 min." }
        infoUrl:         { type: string, nullable: true }
        publishDate:     { type: string, format: date-time }
        mangaTitle:      { type: string, nullable: true, description: "Structured series title. Fully populated when known; the intended primary path for a future Mangarr (parsing title is then optional). null only when genuinely unknown." }
        chapterNumber:   { type: number, nullable: true, description: "Decimal chapter number, first-class data. Fully populated when known (>=3 decimal places preserved) and the intended primary path for a future Mangarr; parsing the title becomes optional. null only when genuinely unknown." }
        volume:          { type: integer, nullable: true, description: "Structured volume number. Populated when known; first-class data alongside chapterNumber. null only when genuinely unknown." }
        language:        { type: string, nullable: true, description: "BCP-47 translated language -> ReleaseInfo.TranslatedLanguage. First-class data; fully populated when known. null only when genuinely unknown." }
        scanlationGroup: { type: string, nullable: true, description: "Structured scanlation/translation group. Populated when known; first-class data the future Mangarr reads directly. null only when genuinely unknown." }
        pageCount:       { type: integer, nullable: true, description: "Page count for the chapter. Populated when known; first-class structured data. null only when genuinely unknown." }
        sizeBytes:       { type: integer, default: 0 }
        ids:             { type: object, additionalProperties: true, nullable: true, description: "Cross-reference source ids (e.g. mangadexChapterId/mangadexMangaId). First-class structured data; populated when known." }

    SubmitRequest:
      type: object
      required: [releaseHandle, sourceKey]
      properties:
        releaseHandle:  { type: string, description: "the Release.downloadHandle from /search" }
        downloadUrl:    { type: string, nullable: true, description: "optional gateway-internal manifest URL" }
        sourceKey:      { type: string }
        title:          { type: string }
        mangaId:        { type: integer, description: "Mangarr's manga id (for output folder naming)" }
        mangaTitle:     { type: string }
        chapterIds:     { type: array, items: { type: integer } }
        chapterNumbers: { type: array, items: { type: number } }
        outputFormat:   { type: string, enum: [cbz, cbt, folder], default: cbz }

    SubmitResponse:
      type: object
      required: [jobId]
      properties:
        jobId:   { type: string, nullable: true, description: "null on rejection; else the DownloadId" }
        status:  { type: string, enum: [queued, resolving] }
        message: { type: string, nullable: true }

    DownloadJob:
      type: object
      required: [jobId, title, status]
      properties:
        jobId:           { type: string }
        title:           { type: string }
        sourceKey:       { type: string }
        status:          { type: string, enum: [queued, resolving, downloading, archiving, completed, failed, warning, paused] }
        totalBytes:      { type: integer, default: 0 }
        remainingBytes:  { type: integer, default: 0 }
        totalPages:      { type: integer, nullable: true }
        downloadedPages: { type: integer, nullable: true }
        etaSeconds:      { type: integer, nullable: true }
        outputPath:      { type: string, nullable: true, description: "host-reachable (after remote-path-map) when completed" }
        message:         { type: string, nullable: true }
        createdAt:       { type: string, format: date-time }
        updatedAt:       { type: string, format: date-time }
        completedAt:     { type: string, format: date-time, nullable: true }

    StatusResponse:
      type: object
      required: [isLocalhost, outputRootFolders]
      properties:
        isLocalhost:               { type: boolean }
        removesCompletedDownloads: { type: boolean, default: false }
        outputRootFolders:         { type: array, items: { type: string } }
        version:                   { type: string }
        capabilities:
          type: object
          properties:
            pause:                 { type: boolean }
            outputFormats:         { type: array, items: { type: string } }
            maxConcurrentChapters: { type: integer }
