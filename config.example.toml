# Manga Gateway configuration template.
#
# Copy to config.toml (gitignored). On first start with no api_key, the gateway
# auto-generates one, writes it back here, and logs it ONCE (D-01). Do NOT set
# the key via the environment — GATEWAY_API_KEY is intentionally ignored.
#
# Env vars override ops knobs (D-11). Precedence: env > TOML > default.
# Any Settings field can be overridden via GATEWAY_<NAME> (e.g. GATEWAY_HOST,
# GATEWAY_PORT, GATEWAY_URL_BASE, GATEWAY_OUTPUT_ROOT). GATEWAY_API_KEY is
# intentionally ignored (D-01).

# api_key = "<auto-generated on first start; do not hand-edit>"

host = "127.0.0.1"      # AUTH-02: localhost bind by default
port = 9191
url_base = ""           # PLAT-01: UrlBase reverse-proxy prefix; "" = none
output_root = "/data/manga"

# ── Anti-bot / Cloudflare engine ──────────────────────────────────────────────
# cloudflare_engine: "patchright" (Chromium, default) runs Comix /search
#   candidates in parallel; "camoufox" (Firefox) is the fallback for hosts where
#   Chromium's fingerprint is flagged (e.g. some datacenter runners, #35).
# cloudflare_fetch_concurrency: parallel browser navigations per /search.
#   Default 3. ONLY safe with engine="patchright" — engine="camoufox" REQUIRES
#   this to be 1 (the gateway fails fast at startup otherwise, #64).
# cloudflare_engine = "patchright"
# cloudflare_fetch_concurrency = 3

# ── Single static residential proxy (PROXY-01, issue #65) ─────────────────────
# Route BOTH the stealth browser (Cloudflare clearance) AND the shared httpx
# image-fetch client through ONE proxy. cf_clearance is IP-bound, so both legs
# MUST share the same egress IP — a datacenter-IP host routes Chromium through a
# residential proxy here to clear CF. Unset ⇒ no proxy (today's behavior).
# cloudflare_proxy_server: e.g. "http://host:port". "Configured" iff this is set.
# cloudflare_proxy_username: optional; omit for an unauthenticated proxy.
# cloudflare_proxy_password: SECRET. Set it via the environment
#   (GATEWAY_CLOUDFLARE_PROXY_PASSWORD) — do NOT hand-edit a real value here and
#   NEVER commit a real proxy credential.
# cloudflare_proxy_server = "http://host:port"
# cloudflare_proxy_username = "<proxy username>"
# cloudflare_proxy_password = "<from env GATEWAY_CLOUDFLARE_PROXY_PASSWORD; do not hand-edit>"

# ── Search-result / chapter-link caching (Phase 9) ────────────────────────────
# The source-agnostic enumeration cache (env > TOML > default).
# enum_cache_enabled: kill-switch (D-08), default true. Set false to disable
#   caching entirely while debugging stale/wrong results.
# enum_cache_maxsize: max cached series enumerations (≥1). Caps cache memory.
# enum_cache_ttl_seconds: cache TTL; default 1800 (30 min). MUST stay ≤ 3600 (the
#   60-min downloadHandle TTL) — the gateway fails fast at startup otherwise (D-09).
enum_cache_enabled = true
enum_cache_maxsize = 512
enum_cache_ttl_seconds = 1800
