# Manga Gateway configuration template.
#
# Copy to config.toml (gitignored). On first start with no api_key, the gateway
# auto-generates one, writes it back here, and logs it ONCE (D-01). Do NOT set
# the key via the environment — GATEWAY_API_KEY is intentionally ignored.
#
# Env vars override ONLY ops knobs (D-11):
#   GATEWAY_HOST, GATEWAY_PORT, GATEWAY_OUTPUT_ROOT

# api_key = "<auto-generated on first start; do not hand-edit>"

host = "127.0.0.1"      # AUTH-02: localhost bind by default
port = 9191
url_base = ""           # PLAT-01: UrlBase reverse-proxy prefix; "" = none
output_root = "/data/manga"
