# Nightly per-source live-smoke run.
#
# Phase 5 D-56 / D-57 / D-58 / D-59 productionization:
#   * D-56: fires on cron '0 3 * * *' (03:00 UTC) + workflow_dispatch (manual).
#   * D-57: minimal permissions — contents:read (matches ci.yml) PLUS issues:write
#     (sticky-issue upsert/close performed by scripts/nightly_triage.py).
#   * D-58: the JOB exit code is owned by scripts/nightly_triage.py — single-source
#     failures route to a sticky GitHub issue (badge stays green); only an
#     all-sources-fail flips the workflow red ("hold the line").
#   * D-59: artifact upload is logs-only — junit.xml + pytest-live.log. NO CBZs,
#     NO screenshots, NO captured fixtures (RESEARCH Security Domain explicit).
#
# Cloudflare engine (#35 / #40 / comix-parallel-engine-probe): Patchright/
# Chromium is the default since the parallel-search finding (only Chromium runs
# concurrent CF navigations). This workflow now runs the SAME default —
# ``GATEWAY_CLOUDFLARE_ENGINE: patchright`` — to RE-TEST whether Chromium clears
# Comix's Cloudflare on the ubuntu-latest datacenter runner. Issue #35 recorded
# Patchright TIMING OUT here, but camoufox passing on the same runner proved the
# block is a fingerprint signal, not pure datacenter-IP reputation — so it is
# worth empirically re-checking. If Chromium fails here, pin
# ``GATEWAY_CLOUDFLARE_ENGINE: camoufox`` + ``GATEWAY_CLOUDFLARE_FETCH_CONCURRENCY: "1"``
# (camoufox cannot run parallel). Both engines back the same AntiBotSolver
# interface; the swap is a single env var.
#
# Sibling to .github/workflows/ci.yml (the deterministic gate). D-12 invariant:
# this workflow NEVER replaces `uv run nox -s gate` — they run independently;
# the nightly is an additive recurring real-network signal, not a gate.
#
# Action SHA pinning + persist-credentials:false mirror ci.yml's supply-chain
# discipline (RESEARCH security domain — CodeRabbit/zizmor: excessive-permissions
# + tampering via floating tag).

name: nightly-live-smoke

on:
  schedule:
    - cron: '0 3 * * *'  # D-56: 03:00 UTC daily
  workflow_dispatch: {}

# Least-privilege workflow token (D-57).
permissions:
  contents: read
  issues: write

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    # Patchright/Chromium is the default since comix-parallel-engine-probe; this
    # runs the SAME engine production residential deploys use, so CI exercises the
    # real parallel Chromium path (fetch_concurrency inherits the default 3).
    #
    # HEADED + Xvfb (the cf-fingerprint-probe finding, 2026-06-01): bare HEADLESS
    # Chromium is fingerprint-flagged by Cloudflare on this datacenter runner (CF
    # detects headless Chrome at the binary level), but HEADED Chromium under an
    # Xvfb virtual display clears it (proven 2-4s vs headless 46s timeout). So pin
    # GATEWAY_CLOUDFLARE_HEADLESS=false; the solver auto-starts Xvfb via
    # pyvirtualdisplay (the ``xvfb`` apt package below provides the binary).
    #
    # Residential proxy (PROXY-01, #65; debug session nightly-cf-warm-127-128 →
    # issues #127/#128): the ubuntu-latest datacenter (Azure ASN) IP can no longer
    # earn cf_clearance from comix.to/mangadot.net — an IP/ASN-reputation block, not
    # a code or fingerprint regression (warm path byte-identical across the
    # good→bad commit range). The #65 proxy seam was merged but never wired here, so
    # every nightly egressed bare and comix+mangadot timed out nightly. These route
    # BOTH the stealth-browser CF clearance AND the httpx image fetch through one
    # residential proxy (cf_clearance is IP-bound, so both legs MUST share the IP).
    # cloudflare_proxy_server is None when the secret is unset → today's bare-egress
    # behavior is preserved on forks / unconfigured repos.
    env:
      GATEWAY_CLOUDFLARE_ENGINE: patchright
      GATEWAY_CLOUDFLARE_HEADLESS: "false"
      GATEWAY_CLOUDFLARE_PROXY_SERVER: ${{ secrets.GATEWAY_CLOUDFLARE_PROXY_SERVER }}
      GATEWAY_CLOUDFLARE_PROXY_USERNAME: ${{ secrets.GATEWAY_CLOUDFLARE_PROXY_USERNAME }}
      GATEWAY_CLOUDFLARE_PROXY_PASSWORD: ${{ secrets.GATEWAY_CLOUDFLARE_PROXY_PASSWORD }}
      # #198/#202/#234: kagane.to + mangadot.net + comix.to serve a Cloudflare
      # managed challenge the headed-Xvfb-Linux solver cannot clear (only a
      # headed-macOS fingerprint clears these). comix joined this set 2026-06-13
      # (#234): it ESCALATED its challenge so the Linux nightly now gets
      # `cf_clearance not captured within 60s` on every warm — every comix live
      # test TimeoutErrors (incl. caps_smoke, which only waits for the warm).
      # Disabling drops them from the registry → out of /caps, search, and the
      # solver warm set, so they stop nightly-false-redding AND stop the doomed-warm
      # storm at startup. REVERSIBLE: drop a source here once the Patchright
      # Linux-fingerprint work (#202) restores its clearance. (The comix `_=` token
      # fix in this same branch/#232 is correct + macOS-verified — it works wherever
      # comix clears; it is just unverifiable in this Linux nightly until #234.)
      # Supersedes their ci_skip_reason gates (redundant but kept as a fallback).
      GATEWAY_DISABLED_SOURCES: kagane,mangadot,comix
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening); trailing
      # comment records the human-readable tag — same discipline as ci.yml.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false  # don't leak the token into the checkout
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv python install 3.12
      - run: uv sync --dev
      # Patchright's Chromium + its system libraries — the default engine's
      # browser. ``--with-deps`` provisions the Linux libs Chromium needs.
      - run: uv run patchright install --with-deps chromium
      # Camoufox's Firefox build is still fetched (~200 MB, runner has the disk)
      # so a fallback re-run with ``GATEWAY_CLOUDFLARE_ENGINE=camoufox`` +
      # ``GATEWAY_CLOUDFLARE_FETCH_CONCURRENCY=1`` works without a workflow edit
      # if the headed-Chromium path regresses on the datacenter runner.
      #
      # ``continue-on-error: true`` (debug nightly-camoufox-fetch-504): this is a
      # fallback-only convenience pre-fetch for an engine the nightly NEVER runs
      # (engine=patchright, above). A transient GitHub-releases 504 on the
      # third-party daijro/camoufox release asset MUST NOT sink a patchright
      # nightly — decouple it from the critical path. The live step (also
      # ``continue-on-error``) plus the triage step own the real signal/exit code.
      - run: uv run camoufox fetch
        continue-on-error: true
      # Xvfb provides the virtual display the HEADED Chromium launch needs on this
      # display-less runner (the solver auto-starts it via pyvirtualdisplay); the
      # realistic fonts reduce the Linux font-fingerprint anomaly.
      - run: sudo apt-get update && sudo apt-get install -y xvfb fonts-liberation fonts-noto-color-emoji

      # Live step — D-58 / Pitfall 4: `continue-on-error: true` so a per-source
      # failure does NOT short-circuit the triage step below. The job's final
      # exit code is owned by the triage step, not by this `pytest` invocation.
      - id: live
        continue-on-error: true
        run: uv run nox -s live 2>&1 | tee pytest-live.log

      # Triage step — `if: always()` so it runs whether the live step passed
      # or failed (Pitfall 4). The script parses junit.xml, buckets results by
      # source_key, upserts/closes per-source sticky issues, and returns the
      # D-58 all-sources-fail exit code that becomes the JOB conclusion.
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python scripts/nightly_triage.py --junit junit.xml --run-url "$RUN_URL"

      # Logs-only artifact upload (D-59). NO CBZ glob, NO screenshot glob, NO
      # captured-fixture glob — the nightly is a signal, not a data drop.
      # `if: always()` so triage can be performed on a red run too.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-live-smoke-logs
          path: |
            junit.xml
            pytest-live.log
          retention-days: 14
