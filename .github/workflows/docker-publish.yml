# Build + publish the production container images to GHCR.
#
# LD-2 (06-TASKBRIEF, 2026-06-01) + 260623-qvv (release pipeline):
#   * Triggers on a `v*` git tag push (release) + `workflow_dispatch` (manual).
#   * Publishes BOTH owned images via a build matrix:
#       - ghcr.io/devbrian/mangarrgateway                 (gateway,  context .)
#       - ghcr.io/devbrian/mangarrgateway-android-solver  (sidecar,  context android_solver/)
#     each tagged :<version> + :<major>.<minor> + :latest.
#   * linux/amd64 ONLY (Chromium/Playwright + redroid are amd64-bound; no arm64).
#   * redroid is the THIRD-PARTY public image redroid/redroid:11.0.0-latest — it is
#     NOT republished here; the release compose pulls it straight from Docker Hub.
#
# Sibling to — but INDEPENDENT of — .github/workflows/ci.yml (the deterministic
# gate). D-12 invariant: this workflow ONLY builds/publishes the images; it NEVER
# replaces `uv run nox -s gate`.
#
# Supply-chain discipline (matches ci.yml / nightly-live-smoke.yml): every
# third-party action is pinned to a full commit SHA with a trailing # vX.Y.Z
# comment (no floating @vN tags — zizmor/CodeRabbit: tampering-via-floating-tag);
# checkout uses persist-credentials:false; least-privilege permissions (only
# packages:write, which GHCR push requires, on top of contents:read).

name: docker-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Least-privilege workflow token: read the repo + push the package to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gateway — main API image (build context = repo root).
          - image: ghcr.io/devbrian/mangarrgateway
            context: .
          # Android-WebView Cloudflare solver sidecar (build context = android_solver/;
          # its Dockerfile carries adb + the solver package ONLY, never gateway source).
          - image: ghcr.io/devbrian/mangarrgateway-android-solver
            context: android_solver
    steps:
      # Same pinned checkout SHA as ci.yml / nightly-live-smoke.yml.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false  # don't leak the token into the checkout

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions layer cache blunts the large Chromium-layer build time.
          # Scope per image so the two matrix legs don't clobber each other's cache.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
