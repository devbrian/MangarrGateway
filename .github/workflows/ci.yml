name: ci

# Trigger only on PRs (covers the per-branch work) + pushes to main (covers the
# post-merge "main is green" signal). Avoids the duplicate run that the
# previous `[push, pull_request]` shape fired on every PR-branch push.
#
# `paths-ignore` skips runs whose entire diff is docs/planning metadata:
# .planning/** (STATE.md, plans, summaries), .claude/** (agent skills,
# instructions), top-level / nested *.md, and docs/**. Anything else — src,
# tests, pyproject.toml, uv.lock, the OpenAPI contract, noxfile.py, the
# workflow files themselves — still triggers.
on:
  pull_request:
    paths-ignore:
      - '.planning/**'
      - '.claude/**'
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '.planning/**'
      - '.claude/**'
      - '**.md'
      - 'docs/**'

# Least-privilege default token (CodeRabbit/zizmor: excessive-permissions).
permissions:
  contents: read

jobs:
  gate:
    # Linux runner: uvloop is active here (absent on the Windows dev host).
    # The contract test binds no port (in-process ASGITransport), so the loop
    # implementation is irrelevant to it.
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening); trailing
      # comment records the human-readable tag.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false # don't leak the token into the checkout
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv python install 3.12
      - run: uv sync --dev
      # Patchright (the Cloudflare solver) ships only the driver; the Chromium
      # binary must be installed separately. The deterministic gate exercises
      # the lifespan (test_solver_wiring) which spawns a non-blocking
      # ``solver.warm()`` — without an installed Chromium that task hangs the
      # process until the runner's job timeout. Install it once here so warm
      # either succeeds or fails fast, never the SIGTERM-on-timeout path.
      - run: uv run patchright install --with-deps chromium
      # The SAME command runnable locally (D-12).
      - run: uv run nox -s gate
