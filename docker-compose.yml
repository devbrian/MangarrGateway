# Manga Gateway — local-dev / prod-parity compose (base).
#
# `docker compose up --build` builds the image from LOCAL source (this repo as
# the build context) and runs it prod-parity, single-process (R1). A
# docker-compose.override.yml sits alongside and is AUTO-MERGED by a plain
# `docker compose up` — it adds a ./src bind-mount for live iteration.
#
# For a CLEAN prod-parity run that EXCLUDES the dev override, pass the base file
# explicitly:
#     docker compose -f docker-compose.yml up --build
#
# The auto-generated API key, the SQLite DB, cf_clearance, the metrics snapshot
# DB (`/state/metrics.db`), and the JSON-lines logs (`/state/logs/gateway.jsonl`,
# which the metrics dashboard reads directly off the volume) all live on the
# app-data mount (`/state`); CBZ output lives on the downloads mount
# (`/data/manga`). Both default to Docker NAMED volumes (portable, work on any
# host incl. the Windows dev box). To land them on specific HOST directories
# (e.g. a Linux server), set MANGARR_STATE_DIR / MANGARR_DOWNLOADS_DIR in .env —
# see .env.example. When a host path is used, it must be writable by the
# container's non-root uid 10001 (chown 10001:10001 <dir>).
#
# ─────────────────────────────────────────────────────────────────────────────
# ANDROID-WEBVIEW CLOUDFLARE SOLVER (Phase 10 — mangadot + kagane).
# `mangadot.net` and `kagane.to` serve a STRICT Cloudflare Turnstile that no
# desktop browser automation can clear from Linux (a render-consistency catch-22 —
# see README "Android-WebView Cloudflare solver"). A REAL Android WebView is a
# trusted fingerprint class that clears it. Two sidecars below provide that:
#   redroid         — Android 11 in Docker (privileged, host iGPU); runs the WebView.
#   android-solver  — drives redroid over adb+CDP, mints {cf_clearance, user_agent}.
# The gateway reaches android-solver over the docker-internal network ONLY; the
# Android machinery stays out of the gateway process (R1 — gateway image UNCHANGED).
#
# OPT-IN via the `android` COMPOSE PROFILE: redroid + android-solver (and the host
# ports they publish below) only start when the `android` profile is active. A bare
# `docker compose up` runs the gateway ALONE — works with NO .env, exposes NO extra
# ports (secure default), and the gateway boots mangadot/kagane disabled (D-33). To
# run the full Android stack set `COMPOSE_PROFILES=android` in .env (the deploy
# default — see .env.example) or pass `--profile android`. The sidecar REQUIRES
# GATEWAY_ANDROID_SOLVER_API_KEY (it fails fast on an empty key), so the profile and
# the key go together.
#
# HOST PREREQUISITE (redroid will NOT boot without it): the host kernel must load
# the `binder_linux` (+ `ashmem_linux`) modules. Kernel 5.15-generic ships them as
# loadable modules (binderfs) — no rebuild. Load + persist on the host once:
#     sudo modprobe binder_linux ashmem_linux
#     printf 'binder_linux\nashmem_linux\n' | sudo tee /etc/modules-load.d/redroid.conf
# iGPU passthrough: the host must expose `/dev/dri` (the Alder Lake iGPU on the
# deploy) — required so Android renders WebGL on REAL hardware and the
# render-consistency check passes.
# SHARED EGRESS IP: redroid and the gateway's httpx MUST egress the same public IP
# (cf_clearance is IP-bound). The deploy NATs both through the home WAN IP. If a
# residential proxy is ever added for these sources, redroid must egress the SAME
# proxy. LANDMINE: do NOT `adb root` against redroid — it wedges adbd; the solver
# runs UNROOTED. Recover a wedged device by restarting the redroid container.
# ─────────────────────────────────────────────────────────────────────────────

services:
  gateway:
    build: .
    ports:
      - "9191:9191"
    # Tolerate a missing .env so `docker compose up --build` works out of the box
    # (the Dockerfile bakes the env defaults). Copy .env.example → .env to set
    # operator knobs. The long form `required: false` is the Compose-spec way to
    # make the env_file optional.
    env_file:
      - path: .env
        required: false
    # Point the gateway at the android-solver sidecar (docker-internal name +
    # port). The URL is not a secret; the api key comes from .env and MUST match
    # the sidecar's SOLVER_API_KEY (both read the SAME .env value below). When
    # GATEWAY_ANDROID_SOLVER_API_KEY is unset, the AndroidSolver leg boots its
    # sources (mangadot/kagane) disabled (D-33) and the gateway still runs.
    environment:
      GATEWAY_ANDROID_SOLVER_URL: "http://android-solver:8080"
      GATEWAY_ANDROID_SOLVER_API_KEY: "${GATEWAY_ANDROID_SOLVER_API_KEY:-}"
    # `required: false` so a bare `docker compose up` (the `android` profile NOT
    # active) starts the gateway ALONE — it neither waits on nor errors about the
    # profiled android-solver. When the `android` profile IS active
    # (COMPOSE_PROFILES=android in .env), the sidecar starts first (service_started).
    depends_on:
      android-solver:
        condition: service_started
        required: false
    volumes:
      # App data (config.toml + the auto-generated API key, gateway.db,
      # the SQLite downloadHandle store `handles.db` (restart-survival, D-16
      # reversal), cf_clearance, the metrics snapshot DB `metrics.db`, and the
      # JSON-lines logs under `logs/gateway.jsonl`). Defaults to `gateway-state`
      # volume; set MANGARR_STATE_DIR=/opt/mangarrgateway (in .env) to bind a host dir.
      - ${MANGARR_STATE_DIR:-gateway-state}:/state
      # CBZ downloads/output. Defaults to the named `gateway-output` volume; set
      # MANGARR_DOWNLOADS_DIR=/mnt/mediatrial/mangarr_dl (in .env) to bind a host dir.
      - ${MANGARR_DOWNLOADS_DIR:-gateway-output}:/data/manga
    restart: unless-stopped
    # NOTE: command is intentionally NOT overridden — inherit the Dockerfile's
    # single-process `python -m manga_gateway` CMD. NEVER add --workers (R1).

  # ── redroid — Android 11 in Docker (the real WebView that clears the strict
  # Turnstile). privileged + the host iGPU device are REQUIRED for real-GPU WebGL
  # (T-10-16, accepted/scoped): scoped to ONLY /dev/dri, no host network. Needs the
  # host binder_linux/ashmem_linux modules loaded (see the top-of-file HOST PREREQ).
  #
  # adb 5555 is DOCKER-INTERNAL ONLY (no host publish) — hardening for #215. adb is
  # full device control, so it is NEVER reachable from the host/LAN. The android-solver
  # sidecar reaches the device over the compose network (SOLVER_ADB_TARGET=redroid:5555);
  # nothing outside the docker network needs adb (the gateway, the rate-limit probe, and
  # CI all talk only to android-solver's /solve). For one-off manual device inspection,
  # exec into this container or run adb from inside the docker network — do NOT re-add a
  # host port publish on any host reachable from an untrusted network.
  redroid:
    image: redroid/redroid:11.0.0-latest
    profiles: ["android"]  # opt-in: only starts when COMPOSE_PROFILES=android (or --profile android)
    privileged: true
    # Host iGPU passthrough → Android gets REAL GPU WebGL (Intel UHD, OpenGL ES
    # 3.2) so CF's render-consistency hash passes. The boot arg below selects it.
    devices:
      - "/dev/dri:/dev/dri"
    # redroid takes Android boot args as its COMMAND. host GPU mode pairs with the
    # /dev/dri device above.
    command:
      - androidboot.redroid_gpu_mode=host
    volumes:
      # Persistent Android /data (the cleared cookie jar / WebView state). Defaults
      # to a named volume; set MANGARR_REDROID_DIR to bind a host dir.
      - ${MANGARR_REDROID_DIR:-redroid-data}:/data
    # Gate readiness on Android finishing boot (sys.boot_completed=1). The
    # healthcheck runs INSIDE the redroid container, where `getprop` is available
    # directly — the redroid image ships `adbd` (listening on 5555 for the
    # android-solver sidecar) but NOT the `adb` CLIENT, so an adb-based probe here
    # always fails even on a fully-booted device. Read the prop locally instead.
    # android-solver depends_on this being healthy before it connects over adb.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "[ \"$$(getprop sys.boot_completed 2>/dev/null | tr -d '\\r')\" = \"1\" ]",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ── android-solver — thin sidecar (adb + the solver code, no gateway source).
  # Built from android_solver/Dockerfile. Drives redroid over adb+CDP and serves
  # the authenticated control API (POST /solve). Every secret arrives via env
  # (NOT baked, T-10-18); /solve is X-Solver-Key-auth'd + host-allowlisted (SEC-01).
  #
  # 8080 EXPOSURE (operator decision): T-10-12 originally kept the control API
  # docker-internal only. Published ONLY when the `android` profile is active. On a
  # trusted LAN-only deploy the operator publishes it (host 18080) so the solve path
  # can be exercised/load-tested directly (`POST http://<host>:18080/solve`,
  # X-Solver-Key required). REMOVE this mapping for any deployment whose host is
  # reachable from an untrusted network.
  android-solver:
    build: android_solver/
    profiles: ["android"]  # opt-in: only starts when COMPOSE_PROFILES=android (or --profile android)
    ports:
      - "18080:8080"  # control API /solve — LAN-only; only published when the android profile is active
    depends_on:
      redroid:
        condition: service_healthy
    environment:
      # MUST match the gateway's GATEWAY_ANDROID_SOLVER_API_KEY (same .env value).
      SOLVER_API_KEY: "${GATEWAY_ANDROID_SOLVER_API_KEY:-}"
      # The redroid adb target on the docker-internal network (service name:5555).
      SOLVER_ADB_TARGET: "redroid:5555"
      # SSRF allowlist — the only challenge hosts the sidecar will drive a device
      # against (the strict-Turnstile sources). Anything else → 422. mangaball.net
      # joined 2026-06-15 (#243): its managed challenge is unclearable by desktop
      # Chromium from our Linux fingerprint, same as mangadot/kagane.
      SOLVER_ALLOWED_HOSTS: "mangadot.net,kagane.to,mangaball.net"
      # Per-solve wall-clock cap (an Android WebView solve is slower than desktop).
      SOLVER_SOLVE_TIMEOUT_S: "120"
    restart: unless-stopped

volumes:
  gateway-state:
  gateway-output:
  redroid-data:
